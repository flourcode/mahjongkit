<rect x="199.0" y="517.5" width="20" height="14" rx="3" fill="#C9B6F0"/><rect x="197.5" y="516" width="20" height="12.5" rx="3" fill="#E6DBFF" stroke="#fff" stroke-width="1"/><rect x="237.5" y="575" width="285" height="34" rx="10" fill="#FFD9E8"/><text x="380.0" y="592" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#8E2658">East (dealer)</text><rect x="237.5" y="136" width="285" height="34" rx="10" fill="#D8ECFF"/><text x="380.0" y="153" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A">Across</text><rect x="584.5" y="250" width="34" height="285" rx="10" fill="#D8ECFF"/><text x="601.5" y="392.5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A" transform="rotate(90 601.5 392.5)">East’s right</text><rect x="141.5" y="250" width="34" height="285" rx="10" fill="#D8ECFF"/><text x="158.5" y="392.5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A" transform="rotate(-90 158.5 392.5)">East’s left</text><text x="380.0" y="348.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4C6D91">Turns move to the right</text><text x="380.0" y="366.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4C6D91">(counterclockwise)</text><path d="M 320.0 412.5 A 62 44 0 1 0 440.0 412.5" fill="none" stroke="#7FA7D4" stroke-width="3" stroke-linecap="round"/><path d="M 440.0 412.5 l -2 -13 l 11 7 z" fill="#7FA7D4" transform="rotate(20 440.0 412.5)"/><line x1="225.5" y1="408" x2="310.0" y2="468.5" stroke="#6B5D91" stroke-width="1.6" stroke-dasharray="4 4"/><text x="314.0" y="474.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6B5D91">Gap: 8 stacks counted</text><text x="314.0" y="492.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#6B5D91">from this wall&#8217;s right end</text><path d="M 189.5 396 L 189.5 286" stroke="#C13B7A" stroke-width="3" stroke-linecap="round"/><path d="M 189.5 276 l -6 11 h 12 z" fill="#C13B7A"/><rect x="40" y="635" width="680" height="137" rx="18" fill="#fff" stroke="#EADFE5" stroke-width="1.5"/><text x="64" y="665" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#C13B7A">Example: East rolls 8.</text><text x="64" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">Count walls to the right, starting with East as 1: East 1, East’s right 2, Across 3,</text><text x="64" y="707" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">East’s left 4, then around again. 8 lands on the wall of the player to East’s left.</text><text x="64" y="728" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">That player counts 8 stacks from the right-hand end of their wall and opens a gap.</text><text x="64" y="749" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">The deal takes tiles from the other side of the gap, moving clockwise along the walls.</text></svg>