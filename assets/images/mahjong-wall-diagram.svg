<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="t d"><title id="t">Breaking East's wall in American Mahjong</title><desc id="d">Four walls of 19 stacks, two tiles high. East rolls two dice and counts that many stacks from the right-hand end of East's own wall, then breaks it there. On a roll of 8, the gap falls after the eighth stack, and selection starts from the break and moves left along the wall, while players take tiles going counterclockwise around the table.</desc><rect width="760" height="820" rx="28" fill="#F3F9FF"/><text x="380.0" y="44" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#211A1E">Breaking the wall</text><text x="380.0" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14" fill="#5E5459">East rolls, then breaks East&#8217;s own wall. 4 walls &#215; 19 stacks &#215; 2 tiles high = 152 tiles</text><rect x="239.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="237.5" y="553" width="13" height="19.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="254.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="252.5" y="553" width="13" height="19.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="269.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="267.5" y="553" width="13" height="19.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="284.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="282.5" y="553" width="13" height="19.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="299.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="297.5" y="553" width="13" height="19.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="314.0" y="554.5" width="13" height="21" rx="3" fill="#E283AC"/><rect x="312.5" y="553" width="13"