l="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="337.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="336" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="352.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="351" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="367.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="366" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="382.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="381" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="397.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="396" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="412.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="411" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="427.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="426" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="442.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="441" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="457.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="456" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="472.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="471" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="487.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="486" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="502.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="501" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="199.0" y="517.5" width="20" height="14" rx="3" fill="#E283AC"/><rect x="197.5" y="516" width="20" height="12.5" rx="3" fill="#F4A7C2" stroke="#fff" stroke-width="1"/><rect x="237.5" y="575" width="285" height="34" rx="10" fill="#FFD9E8"/><text x="380.0" y="592" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#8E2658">East (dealer)</text><rect x="237.5" y="136" width="285" height="34" rx="10" fill="#D8ECFF"/><text x="380.0" y="153" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A">Across</text><rect x="584.5" y="250" width="34" height="285" rx="10" fill="#D8ECFF"/><text x="601.5" y="392.5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A" transform="rotate(90 601.5 392.5)">East’s right</text><rect x="141.5" y="250" width="34" height="285" rx="10" fill="#D8ECFF"/><text x="158.5" y="392.5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" font-weight="800" fill="#17324A" transform="rotate(-90 158.5 392.5)">East’s left</text><text x="380.0" y="352.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4C6D91">Players take tiles to the right</text><text x="380.0" y="370.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#4C6D91">(counterclockwise)</text><path d="M 320.0 412.5 A 62 44 0 1 0 440.0 412.5" fill="none" stroke="#7FA7D4" stroke-width="3" stroke-linecap="round"/><path d="M 440.0 412.5 l -2 -13 l 11 7 z" fill="#7FA7D4" transform="rotate(20 440.0 412.5)"/><path d="M 400.5 539 L 282.5 539" stroke="#C13B7A" stroke-width="3" stroke-linecap="round"/><path d="M 272.5 539 l 11 -6 v 12 z" fill="#C13B7A"/><text x="176" y="503" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="800" fill="#C13B7A">Selection starts at the break and moves this way</text><rect x="40" y="635" width="680" height="172" rx="18" fill="#fff" stroke="#EADFE5" stroke-width="1.5"/><text x="64" y="663" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#C13B7A">Example: East rolls 8.</text><text x="64" y="683" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">East counts 8 stacks from the right-hand end of East’s own wall and breaks it there,</text><text x="64" y="703" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">pushing the right-hand end out towards the middle of the table.</text><text x="64" y="723" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">East takes the first four tiles from the break, then selection goes to East’s right,</text><text x="64" y="743" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">four tiles at a time, three times around, until everyone holds 12.</text><text x="64" y="763" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#211A1E">If East’s wall runs out, the player to East’s left pushes out their own wall next.</text><text x="64" y="793" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6B5D91">The lilac stacks are the 8 counted from East&#8217;s right-hand end; the gap after them is the break.</text></svg>